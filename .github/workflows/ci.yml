name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The shared contracts compile first: both the API and the web app import
      # its build output, so nothing else typechecks until it exists.
      - name: Build shared contracts
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://nova:nova@localhost:5432/nova?schema=public

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://nova:nova@localhost:5432/nova?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000000
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-11111

      # The suite covers pure logic and the HTTP layer, so it needs no database.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://nova:nova@localhost:5432/nova?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000000
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-11111
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

      - name: Check formatting
        run: npm run format:check
