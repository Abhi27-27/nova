# Render blueprint for the NOVA API + database.
#
# Deploy: push this repository to GitHub, then in Render choose
# "New → Blueprint" and point it at the repo. Render provisions the database,
# runs the migrations and starts the API.
#
# The web app deploys separately to Vercel (see vercel.json and DEPLOYMENT.md).

databases:
  - name: nova-postgres
    databaseName: nova
    user: nova
    plan: free

services:
  - type: web
    name: nova-api
    runtime: node
    plan: free
    region: oregon
    # Build the shared contracts, generate the Prisma client, compile the API.
    buildCommand: npm ci && npm run build:shared && npm run build:api
    # Migrations run on start so a fresh database is ready before the first request.
    startCommand: npm run db:deploy --workspace @nova/api && npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nova-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
      # Cross-site cookies require Secure + SameSite=None when the web app is on
      # a different domain than the API.
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: none
      - key: LOG_LEVEL
        value: info
      # Set these to the deployed Vercel URL once the web app is live.
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_APP_URL
        sync: false
